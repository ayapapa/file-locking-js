name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      test_file:
        description: '例 test/FileLockError2.test.ts'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22, 24]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        env:
          TZ: UTC
          CI: true
        run: |
          if [ -n "${{ inputs.test_file }}" ]; then
            npx vitest run "${{ inputs.test_file }}"
          else
            npm test
          fi

      - name: Run coverage
        if: matrix.node-version == 24
        env:
          TZ: UTC
          CI: true
        run: npm run coverage

      - name: Generate coverage badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node-version == 24
        uses: jpb06/coverage-badges-action@latest
        with:
          coverage-summary-path: coverage/coverage-summary.json